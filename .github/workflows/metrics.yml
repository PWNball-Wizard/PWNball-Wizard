name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: xK1LLER-QU33Nx
          template: classic
          base: header, community, repositories, metadata
          config_timezone: America/Mexico_City

          # 👨‍💻 Lines of code changed (Lo que ya tenías)
          plugin_lines: yes

          # 🈷️ Languages activity (Desglose detallado de lenguajes)
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8

          # 🧑‍🤝‍🧑 People (Tus seguidores y seguidos)
          plugin_people: yes
          plugin_people_types: followers, following
          plugin_people_limit: 28
          plugin_people_size: 28

          # 🎼 Music (Tu playlist de Apple Music integrada)
          # 🎼 Music (Tu playlist de Apple Music integrada)
          plugin_music: yes
          plugin_music_provider: apple
          plugin_music_mode: playlist
          plugin_music_playlist: https://embed.music.apple.com/mx/playlist/radio-disney-apple/pl.u-4JomaoJsX3WrKdk
          plugin_music_limit: 10
          
          # 📓 Featured repositories (Tus proyectos destacados)
          plugin_repositories: yes
          plugin_repositories_pinned: 4
